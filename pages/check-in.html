<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro de Entrada - Educational Symposium 2025</title>
  <link rel="stylesheet" href="../styles/ticket.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <!-- Header superior con botón de navegación -->
  <header class="site-header">
    <div class="header-container">
      <a href="../index.html" class="back-button">
        <i class="fas fa-arrow-left"></i>
        <span>Atrás</span>
      </a>
      <h1 class="header-title">Escáner QR</h1>
    </div>
  </header>

  <main class="page">
    

    <!-- Sección del Escáner QR -->
    <section class="qr-scanner-section" id="qr-scanner-section">
      <header class="scanner-header">
        <h2><i class="fas fa-qrcode"></i> Registro de asistencia por Código QR</h2>
        
      </header>

      <div class="scanner-container">
        <!-- Controles del escáner -->
        <div class="scanner-controls">
          <button class="btn btn-primary" id="start-scanner-btn" onclick="document.getElementById('scan-result-container').style.display = 'none'">
            <i class="fas fa-play"></i>
            <span>Iniciar Escáner</span>
          </button>
        </div>

        <!-- Área de la cámara -->
        <div class="camera-container" id="camera-container" style="display: none;">
          <div class="video-wrapper">
            <video id="qr-video" autoplay muted playsinline></video>
            <button class="btn btn-secondary" id="switch-camera-btn" style="display: none;">
              <i class="fas fa-camera-retro"></i>
              <span>Cambiar Cámara</span>
            </button>
            <div class="qr-overlay">
              <div class="qr-frame">
                <div class="qr-corner qr-corner-top-left"></div>
                <div class="qr-corner qr-corner-top-right"></div>
                <div class="qr-corner qr-corner-bottom-left"></div>
                <div class="qr-corner qr-corner-bottom-right"></div>
                <div class="qr-center-line"></div>
              </div>
            </div>
          </div>
          <div class="scanner-status">
            <i class="fas fa-camera"></i>
            <span id="camera-status">Cámara activa - Apunta al código QR</span>
          </div>
          <div class="camera-info" id="camera-info" style="display: none;">
            <i class="fas fa-info-circle"></i>
            <span>Información de cámara</span>
          </div>
        </div>

        <!-- Área de resultado -->
        <div class="scan-result-container" id="scan-result-container" style="display: none;">
          <div class="result-card">
            <div class="result-icon">
              <i class="fas fa-check-circle" id="result-icon"></i>
            </div>
            <div class="result-content">
              <h3 id="result-title">Código QR Detectado</h3>
              <p id="result-message">El código ha sido leído exitosamente</p>
              <div class="result-details" id="result-details"></div>
            </div>
            <button class="btn btn-outline" id="clear-result-btn">
              <i class="fas fa-times"></i>
              <span>Limpiar</span>
            </button>
          </div>
        </div>

        <!-- Mensajes de error -->
        <div class="error-container" id="error-container" style="display: none;">
          <div class="error-card">
            <div class="error-icon">
              <i class="fas fa-exclamation-triangle"></i>
            </div>
            <div class="error-content">
              <h3 id="error-title">Error del Sistema</h3>
              <p id="error-message">No se pudo inicializar la cámara</p>
            </div>
            <button class="btn btn-outline" id="dismiss-error-btn">
              <i class="fas fa-times"></i>
              <span>Cerrar</span>
            </button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import { getDatabase, ref, get, set, push } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD_99EUF7i60QQ9IIqQwe9hzIN2yjEa2Ks",
      authDomain: "congresoapp-83547.firebaseapp.com",
      databaseURL: "https://congresoapp-83547-default-rtdb.firebaseio.com",
      projectId: "congresoapp-83547",
      storageBucket: "congresoapp-83547.firebasestorage.app",
      messagingSenderId: "689727649320",
    };

    const app = initializeApp(firebaseConfig);
    window.firebaseDatabase = getDatabase(app);
    window.firebaseRef = ref;
    window.firebaseGet = get;
    window.firebaseSet = set;
    window.firebasePush = push;
  </script>
  <script src="../js/qr-scanner.js"></script>
</body>
</html>
