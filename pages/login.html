<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - AdminSymposium</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../styles/custom.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-header .icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 1rem;
        }
        
        .login-header h2 {
            color: #333;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .login-header p {
            color: #666;
            font-size: 0.9rem;
        }
        
        .form-floating {
            margin-bottom: 1.5rem;
        }
        
        .form-floating .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 1rem 0.75rem;
            transition: all 0.3s ease;
        }
        
        .form-floating .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .login-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 1rem;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .back-btn {
            background: transparent;
            border: 2px solid #6c757d;
            color: #6c757d;
            border-radius: 10px;
            padding: 0.75rem 2rem;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        
        .back-btn:hover {
            background: #6c757d;
            color: white;
            transform: translateY(-2px);
        }
        
        .alert {
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        
        .loading {
            display: none;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }
        
        @media (max-width: 576px) {
            .login-card {
                padding: 2rem 1.5rem;
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="icon">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2>Inicio de Sesión</h2>
            <p>Acceso al Panel de Administración</p>
        </div>
        
        <!-- Alertas -->
        <div id="alertContainer"></div>
        
        <!-- Formulario de Login -->
        <form id="loginForm">
            <div class="form-floating">
                <input type="text" class="form-control" id="username" placeholder="Usuario" required>
                <label for="username">
                    <i class="fas fa-user me-2"></i>Usuario
                </label>
            </div>
            
            <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
                <label for="password">
                    <i class="fas fa-lock me-2"></i>Contraseña
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
                <span class="normal-text">
                    <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                </span>
                <span class="loading">
                    <span class="spinner-border spinner-border-sm me-2"></span>
                    Iniciando sesión...
                </span>
            </button>
            
            <a href="../index.html" class="back-btn">
                <i class="fas fa-arrow-left me-2"></i>Volver al Inicio
            </a>
        </form>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Configuración de sesión
        const SESION_CONFIG = {
            user: 'user',
            pass: '123'
        };
        
        class LoginManager {
            constructor() {
                this.init();
            }
            
            init() {
                this.setupEventListeners();
                this.checkAlreadyLogged();
            }
            
            setupEventListeners() {
                const form = document.getElementById('loginForm');
                form.addEventListener('submit', (e) => this.handleLogin(e));
                
                // Limpiar alertas al escribir
                const usernameInput = document.getElementById('username');
                const passwordInput = document.getElementById('password');
                
                usernameInput.addEventListener('input', () => this.clearAlert());
                passwordInput.addEventListener('input', () => this.clearAlert());
            }
            
            checkAlreadyLogged() {
                const isLogged = sessionStorage.getItem('adminLoggedIn') === 'true';
                if (isLogged) {
                    // Redirigir al panel de administración
                    setTimeout(() => {
                        window.location.href = 'admin-panel.html';
                    }, 500);
                }
            }
            
            async handleLogin(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const loginBtn = document.getElementById('loginBtn');
                
                // Validar campos vacíos
                if (!username || !password) {
                    this.showAlert('Por favor, completa todos los campos', 'warning');
                    return;
                }
                
                // Mostrar estado de carga
                this.setLoading(true);
                this.clearAlert();
                
                try {
                    // Simular delay de autenticación
                    await this.delay(1000);
                    
                    // Validar credenciales
                    if (this.validateCredentials(username, password)) {
                        // Guardar sesión
                        sessionStorage.setItem('adminLoggedIn', 'true');
                        sessionStorage.setItem('adminLoginTime', new Date().toISOString());
                        
                        this.showAlert('¡Inicio de sesión exitoso! Redirigiendo...', 'success');
                        
                        // Redirigir después de un breve delay
                        setTimeout(() => {
                            window.location.href = 'admin-panel.html';
                        }, 1500);
                        
                    } else {
                        this.showAlert('Usuario o contraseña incorrectos', 'danger');
                        document.getElementById('password').value = '';
                        document.getElementById('username').focus();
                    }
                    
                } catch (error) {
                    console.error('Error en login:', error);
                    this.showAlert('Error interno del sistema', 'danger');
                } finally {
                    this.setLoading(false);
                }
            }
            
            validateCredentials(username, password) {
                return username === SESION_CONFIG.user && password === SESION_CONFIG.pass;
            }
            
            setLoading(loading) {
                const loginBtn = document.getElementById('loginBtn');
                const normalText = loginBtn.querySelector('.normal-text');
                const loadingText = loginBtn.querySelector('.loading');
                
                loginBtn.disabled = loading;
                
                if (loading) {
                    normalText.style.display = 'none';
                    loadingText.classList.add('show');
                } else {
                    normalText.style.display = 'inline';
                    loadingText.classList.remove('show');
                }
            }
            
            showAlert(message, type) {
                const alertContainer = document.getElementById('alertContainer');
                
                const alertId = 'alert-' + Date.now();
                const alertHtml = `
                    <div id="${alertId}" class="alert alert-${type} alert-dismissible fade show" role="alert">
                        <i class="fas ${this.getAlertIcon(type)} me-2"></i>
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
                
                alertContainer.innerHTML = alertHtml;
                
                // Auto-dismiss después de 5 segundos para alertas de éxito
                if (type === 'success') {
                    setTimeout(() => {
                        const alert = document.getElementById(alertId);
                        if (alert) {
                            const bsAlert = new bootstrap.Alert(alert);
                            bsAlert.close();
                        }
                    }, 5000);
                }
            }
            
            clearAlert() {
                const alertContainer = document.getElementById('alertContainer');
                alertContainer.innerHTML = '';
            }
            
            getAlertIcon(type) {
                const icons = {
                    'success': 'fa-check-circle',
                    'danger': 'fa-exclamation-triangle',
                    'warning': 'fa-exclamation-circle',
                    'info': 'fa-info-circle'
                };
                return icons[type] || 'fa-info-circle';
            }
            
            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        }
        
        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            new LoginManager();
        });
    </script>
</body>
</html>
