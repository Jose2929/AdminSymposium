<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminSymposium - Educational Symposium 2025</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/custom.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        .main-title {
            color: white;
            font-weight: 300;
            font-size: 3rem;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 3rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }
        
        .icon-margin {
            margin-right: 8px;
        }
        
        /* Menú hamburguesa */
        .navbar-toggler {
            border: none;
            padding: 0.25rem 0.5rem;
        }
        
        .navbar-toggler:focus {
            box-shadow: none;
        }
        
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255, 255, 255, 0.85%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
            width: 1.5em;
            height: 1.5em;
        }
        
        /* Sidebar */
        .sidebar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            min-height: 100vh;
            padding: 2rem 0;
        }
        
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.9);
            padding: 0.75rem 1.5rem;
            margin: 0.25rem 1rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .sidebar .nav-link:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        
        .sidebar .nav-link.active {
            color: white;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .sidebar .nav-link i {
            margin-right: 0.75rem;
            width: 20px;
            text-align: center;
        }
        
        .sidebar-header {
            text-align: center;
            padding: 0 1.5rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 2rem;
        }
        
        .sidebar-header .icon {
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0.5rem;
        }
        
        .sidebar-header h5 {
            color: white;
            font-weight: 600;
            margin: 0;
        }
        
        /* Botones del sidebar */
        .sidebar-btn {
            display: block;
            width: calc(100% - 2rem);
            margin: 0.5rem 1rem;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 10px;
            font-weight: 500;
            text-decoration: none;
            text-align: left;
            transition: all 0.3s ease;
            color: white;
        }
        
        .sidebar-btn:hover {
            transform: translateX(5px);
            color: white;
        }
        
        .btn-entrada {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
        }
        
        .btn-entrada:hover {
            background: linear-gradient(45deg, #3bb5ab, #3a8a7a);
        }
        
        .btn-ticket {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
        }
        
        .btn-ticket:hover {
            background: linear-gradient(45deg, #ff5252, #ff7979);
        }
        
        .btn-admin {
            background: linear-gradient(45deg, #667eea, #764ba2);
        }
        
        .btn-admin:hover {
            background: linear-gradient(45deg, #5a6fd8, #6a4190);
        }
        
        .btn-admin i {
            margin-right: 0.75rem;
        }
        
        /* Menú hamburguesa flotante */
        #sidebarToggle {
            transition: all 0.3s ease;
        }
        
        #sidebarToggle:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 1) !important;
        }
        
        /* Contenido principal */
        .main-content {
            padding: 2rem;
            padding-top: 6rem; /* Espacio para el menú hamburguesa flotante */
        }
        
        /* Ocultar sidebar en móviles por defecto */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2.2rem;
                margin-bottom: 1.5rem;
                margin-top: 1rem;
                line-height: 1.2;
            }
            
            .subtitle {
                font-size: 1.1rem;
                margin-bottom: 2rem;
                color: rgba(255, 255, 255, 0.95) !important;
                opacity: 1 !important;
                display: block !important;
                visibility: visible !important;
                text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
            }
            
            .sidebar {
                position: fixed;
                top: 0;
                left: -100%;
                width: 280px;
                z-index: 1040;
                transition: left 0.3s ease;
            }
            
            .sidebar.show {
                left: 0;
            }
            
            .sidebar-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 1030;
                display: none;
            }
            
            .sidebar-overlay.show {
                display: block;
            }
        }
        
        @media (min-width: 769px) {
            .sidebar {
                position: relative;
                left: 0 !important;
            }
            
            .sidebar-overlay {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- Overlay para móviles -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <!-- Menú hamburguesa flotante en esquina superior para móviles -->
    <div class="position-absolute top-0 start-0 p-3 d-md-none" style="z-index: 1050;">
        <button class="btn btn-light btn-sm rounded-circle shadow" type="button" id="sidebarToggle" style="width: 48px; height: 48px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);">
            <i class="fas fa-bars text-dark"></i>
        </button>
    </div>
    
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" id="sidebar">
                <div class="sidebar-header">
                    <div class="icon">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <h5 id="sidebarTitle">Educational Symposium</h5>
                    <small class="text-white-50" id="sidebarSubtitle">Sistema de Eventos</small>
                </div>
                
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" onclick="showMainContent()">
                            <i class="fas fa-home"></i>
                            Inicio
                        </a>
                    </li>
                </ul>
                
                <hr style="border-color: rgba(255, 255, 255, 0.3); margin: 1.5rem;">

                <div class="sidebar-buttons">
                    <a href="pages/check-in.html" class="sidebar-btn btn-entrada">
                        <i class="fas fa-qrcode"></i>
                        Asistencia
                    </a>

                    <a href="pages/login.html" class="sidebar-btn btn-admin">
                        <i class="fas fa-cogs"></i>
                        Panel de Administración
                    </a>
                </div>
            </nav>
            
            <!-- Contenido principal -->
            <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
                <div class="d-flex flex-column justify-content-center align-items-center" style="min-height: 80vh;">
                    <h1 class="main-title" id="mainTitle">
                        <i class="fas fa-graduation-cap icon-margin"></i>
                        Educational Symposium 2025
                    </h1>
                    <p class="subtitle" id="mainSubtitle">Sistema de Administración de Eventos Educativos</p>
                    
             
                </div>
            </main>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    
    <!-- Firebase JS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { getDatabase, ref, get, set, push, remove, update, child } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

        class FirebaseManager {
            constructor() {
                this.app = null;
                this.database = null;
                this.init();
            }

            init() {
                const firebaseConfig = {
                    apiKey: "AIzaSyD_99EUF7i60QQ9IIqQwe9hzIN2yjEa2Ks",
                    authDomain: "congresoapp-83547.firebaseapp.com",
                    databaseURL: "https://congresoapp-83547-default-rtdb.firebaseio.com",
                    projectId: "congresoapp-83547",
                    storageBucket: "congresoapp-83547.firebasestorage.app",
                    messagingSenderId: "689727649320",
                    appId: "1:689727649320:web:8ab98cfc5b291d2792a71d"
                };
                this.app = initializeApp(firebaseConfig);
                this.database = getDatabase(this.app);
            }

            async getInfo() {
                try {
                    const infoRef = ref(this.database, 'info');
                    const snapshot = await get(infoRef);
                    return snapshot.exists() ? snapshot.val() : null;
                } catch (error) {
                    console.error('Error obteniendo info:', error);
                    throw error;
                }
            }
        }

        // Inicializar FirebaseManager
        const firebaseManager = new FirebaseManager();

        // Función simplificada para cargar título y descripción
        async function loadEventInfo() {
            try {
                console.log('📊 Cargando información del evento desde Firebase...');
                const info = await firebaseManager.getInfo() || {};
                
                console.log('📋 Información del evento obtenida:', info);
                
                // Actualizar título principal (mantener icono)
                const mainTitle = document.getElementById('mainTitle');
                const title = info.titulo || 'Educational Symposium 2025';
                mainTitle.innerHTML = `<i class="fas fa-graduation-cap icon-margin"></i>${title}`;
                
                // Actualizar subtítulo
                const mainSubtitle = document.getElementById('mainSubtitle');
                const subtitle = info.descripcion || 'Sistema de Administración de Eventos Educativos';
                mainSubtitle.textContent = subtitle;
                
                // Actualizar título de la página
                document.title = `${title} - AdminSymposium`;
                
                // Actualizar sidebar
                const sidebarTitle = document.getElementById('sidebarTitle');
                const sidebarSubtitle = document.getElementById('sidebarSubtitle');
                
                if (sidebarTitle) sidebarTitle.textContent = title;
                if (sidebarSubtitle) sidebarSubtitle.textContent = subtitle;
                
                console.log('✅ Información del evento cargada exitosamente');
            } catch (error) {
                console.error('❌ Error cargando información del evento:', error);
                // Mantener valores por defecto en caso de error
            }
        }

        // Hacer disponible globalmente
        window.firebaseManager = firebaseManager;
        window.loadEventInfo = loadEventInfo;
    </script>
    
    <script>
        // Manejo del menú hamburguesa
        document.addEventListener('DOMContentLoaded', function() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            
            function toggleSidebar() {
                sidebar.classList.toggle('show');
                sidebarOverlay.classList.toggle('show');
            }
            
            function hideSidebar() {
                sidebar.classList.remove('show');
                sidebarOverlay.classList.remove('show');
            }
            
            // Event listeners
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', toggleSidebar);
            }
            sidebarOverlay.addEventListener('click', hideSidebar);
            
            // Cerrar sidebar al hacer click en un enlace (solo en móviles)
            const navLinks = document.querySelectorAll('.nav-link, .sidebar-btn');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (window.innerWidth <= 768) {
                        hideSidebar();
                    }
                });
            });
            
            // Cerrar sidebar al redimensionar ventana
            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) {
                    hideSidebar();
                }
            });
            
            // Forzar visibilidad de la descripción en móvil
            function forceSubtitleVisibility() {
                const mainSubtitle = document.getElementById('mainSubtitle');
                if (mainSubtitle) {
                    mainSubtitle.style.display = 'block';
                    mainSubtitle.style.visibility = 'visible';
                    mainSubtitle.style.opacity = '1';
                    mainSubtitle.style.color = 'rgba(255, 255, 255, 0.95)';
                    console.log('🔧 Subtítulo forzado a visible');
                }
            }
            
            // Cargar información del evento desde Firebase
            if (window.loadEventInfo) {
                loadEventInfo();
                // Forzar visibilidad después de cargar
                setTimeout(forceSubtitleVisibility, 100);
                setTimeout(forceSubtitleVisibility, 500);
                setTimeout(forceSubtitleVisibility, 1000);
            }
            
            // Verificar visibilidad en cada resize
            window.addEventListener('resize', forceSubtitleVisibility);
        });
        
        // Función para mostrar contenido principal (placeholder)
        function showMainContent() {
            // En una implementación real, aquí se cargaría contenido dinámico
            console.log('Mostrando contenido principal');
        }
    </script>
</body>
</html>
